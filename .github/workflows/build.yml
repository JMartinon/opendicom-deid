name: Native desktop builds

on:
  # Never package automatically on a push or tag. Native local builds are preferred.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            target: Windows-x86_64
          - os: macos-15
            architecture: arm64
            target: macOS-arm64
          - os: macos-15-intel
            architecture: x64
            target: macOS-x86_64
          - os: ubuntu-24.04
            architecture: x64
            target: Ubuntu-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install Linux build and display support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool python3-tk python3-venv libpython3-dev imagemagick
      - name: Check build interpreter
        run: python scripts/build_environment.py
      - run: python -m pip install '.[build,dev]'
      - run: python -m ruff check .
      - run: python -m pytest
      - name: GUI smoke check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_gui.py
      - name: Folder chooser mouse interaction (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check_folder_dialog.py
      - name: GUI smoke check (Windows / macOS)
        if: runner.os != 'Linux'
        run: python scripts/smoke_gui.py
      - name: Capture Linux GUI previews
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/preview_gui.py
      - name: Upload Linux GUI previews
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GUI-preview-Linux
          path: build/gui-preview/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Build with the Linux wrapper and system Python
        if: runner.os == 'Linux'
        # Exercise the documented distro-Python path and isolated build venv.
        run: PYTHON=/usr/bin/python3 bash scripts/build_linux.sh
      - name: Build Windows / macOS
        if: runner.os != 'Linux'
        run: python scripts/build.py
      - name: Check packaged GUI and process a synthetic RT chain (Windows / macOS)
        if: runner.os != 'Linux'
        run: python scripts/smoke_frozen.py
      - name: Check packaged GUI and process a synthetic RT chain (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_frozen.py
      - name: Frozen application smoke check (macOS)
        if: runner.os == 'macOS'
        run: dist/OpenDICOM-De-ID.app/Contents/MacOS/OpenDICOM-De-ID --version
      - name: Frozen application smoke check (Linux)
        if: runner.os == 'Linux'
        run: dist/OpenDICOM-De-ID/OpenDICOM-De-ID --version
      - name: Upload Windows application (extract once)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-application
          path: dist/windows-app/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDICOM-De-ID-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
