name: Draft versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version, 'Tag must match package version'"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OpenDICOM-De-ID-*
          path: artifacts
          merge-multiple: true
      - name: Create draft prerelease with native archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.txt <<'EOF'
          Offline desktop builds for validation and testing. No publisher signing or notarization is performed.

          Extract the archive and launch OpenDICOM De-ID. Python is included. Review the distribution documentation and licenses before use.

          Automated checks do not establish privacy or clinical suitability. Review pixel annotations, free text, and recognizable anatomy before sharing data.
          EOF
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease --title "OpenDICOM De-ID $RELEASE_TAG" --notes-file release-notes.txt
